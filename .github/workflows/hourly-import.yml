# Imports the three sports JSON feeds (main, Tapmad, SonyLIV) into the admin database every hour.
# Needs two repository secrets (GitHub: Settings > Secrets and variables > Actions):
#   IMPORT_URL   the admin website address, e.g. https://cricup-tv-admin.vercel.app   (no slash at the end)
#   CRON_SECRET  the same long random text that is set as CRON_SECRET in the admin's Vercel project
name: Hourly sports import

on:
  schedule:
    # GitHub often delays or skips scheduled runs, so there are two attempts per hour (minute 7 and minute 37).
    # The import never makes duplicates, so an extra run is harmless. (cron-job.org is the more reliable trigger: see README.)
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:       # lets you also run it by hand from the Actions tab

# Never run two imports at the same time (a manual run waits for the scheduled one): two at once could make duplicate cards.
concurrency:
  group: hourly-sports-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the admin import endpoint
        env:
          IMPORT_URL: ${{ secrets.IMPORT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$IMPORT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "IMPORT_URL and CRON_SECRET secrets are missing."; exit 1
          fi
          # One call per feed, so each one gets its own time budget. A failing feed does not stop the others.
          fail=0
          for feed in main tapmad sonyliv; do
            echo "== $feed =="
            curl --fail-with-body --silent --show-error --max-time 120 \
              -X POST "$IMPORT_URL/api/cron/import?feed=$feed" \
              -H "Authorization: Bearer $CRON_SECRET" || fail=1
            echo
          done
          exit $fail
